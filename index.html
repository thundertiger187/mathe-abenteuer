:root, html, body { color-scheme: only light !important; background: #F3F0FF !important; color: #2D2A4A !important; }
.ma-root, .ma-root * { color-scheme: only light; forced-color-adjust: none; }
.ma-root button { -webkit-appearance: none; appearance: none; }
@keyframes ma-bounce { 0% { transform: scale(0.3); } 50% { transform: scale(1.3); } 75% { transform: scale(0.92); } 100% { transform: scale(1); } }
@keyframes ma-shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes ma-pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes ma-tilt { 0% { transform: rotate(0deg); } 30% { transform: rotate(-14deg); } 65% { transform: rotate(-10deg); } 100% { transform: rotate(0deg); } }
@keyframes ma-hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-14px); } 65% { transform: translateY(0); } 82% { transform: translateY(-5px); } }
@keyframes ma-heart { 0% { transform: translateY(6px) scale(0.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-14px) scale(1.1); opacity: 1; } }
@keyframes ma-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes ma-flash { 0%, 100% { background: rgba(255, 200, 61, 0); } 30%, 70% { background: rgba(255, 200, 61, 0.55); } }
@keyframes ma-fly { 0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; } }
.ma-bounce { animation: ma-bounce 0.7s ease-out both; display: inline-block; }
.ma-shake { animation: ma-shake 0.45s ease-in-out; }
.ma-pop { animation: ma-pop 0.32s ease-out both; }
.ma-tilt { animation: ma-tilt 1.1s ease-in-out; transform-origin: 50% 85%; display: inline-flex; }
.ma-hop { animation: ma-hop 0.9s ease-out; display: inline-flex; }
.ma-heart { animation: ma-heart 1.2s ease-out both; display: inline-block; }
.ma-float { animation: ma-float 3s ease-in-out infinite; display: inline-flex; }
.ma-flash { animation: ma-flash 0.9s ease-in-out; }
.ma-fly { position: absolute; left: 50%; top: 50%; pointer-events: none; animation: ma-fly 1.2s ease-out forwards; }
.ma-btn { transition: transform 0.08s ease; -webkit-tap-highlight-color: transparent; }
.ma-btn:active { transform: translateY(2px) scale(0.98); }
@media (prefers-reduced-motion: reduce) {
  .ma-bounce, .ma-shake, .ma-pop, .ma-tilt, .ma-hop, .ma-heart, .ma-float, .ma-flash { animation: none !important; }
  .ma-fly { display: none; }
  .ma-btn, .ma-btn:active { transition: none; transform: none; }
